name: "Setup lavapipe"
description: "Installs the Mesa lavapipe Vulkan software driver and Linux build dependencies"

runs:
  using: "composite"
  steps:
    - name: Install lavapipe
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers xorg-dev

        icd_file=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
        if [[ -z "$icd_file" ]]; then
          echo "Failed to locate a lavapipe ICD after installing mesa-vulkan-drivers"
          exit 1
        fi

        echo "Using lavapipe ICD: $icd_file"
        echo "VK_DRIVER_FILES=$icd_file" >> "$GITHUB_ENV"
