name: arm64-diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/arm64-diagnostic.yml
      - tools/run-arm64-diagnostic.ps1
      - tests/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-diagnostic-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'dev/skallweit/arm64-d3d12-crash-investigation'
    name: diagnostic (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: original-888-direct, revision: '28b85ae546808fe92442944477efad19d0340fa0', config: Release }
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Save identical diagnostic instrumentation
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/diagnostic-overlay" -Force | Out-Null
          Copy-Item tests/main.cpp, tests/test-ray-tracing-raygen-entrypoint.cpp, tools/run-arm64-diagnostic.ps1 "$env:RUNNER_TEMP/diagnostic-overlay"

      - uses: actions/checkout@v6
        if: matrix.revision != 'current'
        with:
          ref: ${{ matrix.revision }}
          submodules: recursive

      - name: Apply identical diagnostic instrumentation
        run: |
          # Keep the original raygen test body, including its original object lifetimes.
          Copy-Item "$env:RUNNER_TEMP/diagnostic-overlay/main.cpp" tests/
          Copy-Item "$env:RUNNER_TEMP/diagnostic-overlay/*.ps1" tools/

      - uses: step-security/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - uses: lukka/get-cmake@latest

      - name: Configure Release with symbols
        env:
          SLANG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          cmake --preset default
          "-DSLANG_RHI_FETCH_SLANG_VERSION=2026.17.1"
          "-DCMAKE_C_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi"
          "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi /DDOCTEST_CONFIG_NO_WINDOWS_SEH"
          "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF /INCREMENTAL:NO"
          "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF /INCREMENTAL:NO"

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --target slang-rhi-tests

      - name: Install and verify postmortem crash capture
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $dumpFolder = (New-Item -ItemType Directory -Force build/diagnostics/dumps).FullName
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile "$env:RUNNER_TEMP/Procdump.zip"
          Expand-Archive "$env:RUNNER_TEMP/Procdump.zip" "$env:RUNNER_TEMP/Procdump"
          & "$env:RUNNER_TEMP/Procdump/procdump64a.exe" -accepteula -ma -i $dumpFolder
          if ($LASTEXITCODE -ne 0) { throw 'Could not install postmortem debugger' }
          '#include <windows.h>' | Set-Content build/capture-selftest.c
          'int main(void) { RaiseException(EXCEPTION_ACCESS_VIOLATION, EXCEPTION_NONCONTINUABLE, 0, 0); return 0; }' | Add-Content build/capture-selftest.c
          cl /nologo /Zi build/capture-selftest.c /Febuild/capture-selftest.exe /Fobuild/capture-selftest.obj /Fdbuild/capture-selftest.pdb
          if ($LASTEXITCODE -ne 0) { throw 'Could not build dump-capture self-test' }
          $selfTest = Start-Process -FilePath (Resolve-Path build/capture-selftest.exe) -WindowStyle Hidden -PassThru
          if (!$selfTest.WaitForExit(60000)) {
            $selfTest.Kill()
            throw 'Dump-capture self-test timed out'
          }
          $selfTestDumps = @(Get-ChildItem $dumpFolder -Filter '*.dmp')
          if ($selfTest.ExitCode -eq 0 -or $selfTestDumps.Count -eq 0) {
            throw "Crash capture failed self-test: exit=$($selfTest.ExitCode), dumps=$($selfTestDumps.Count)"
          }
          New-Item -ItemType Directory -Force build/capture-selftest | Out-Null
          $selfTestDumps | Move-Item -Destination build/capture-selftest/
          Write-Host "Verified postmortem capture: exit=$($selfTest.ExitCode), dumps=$($selfTestDumps.Count)"

      - name: Run diagnostic workloads
        run: ./tools/run-arm64-diagnostic.ps1 -Direct -BuildDirectory "build/${{ matrix.config }}" -RaygenRepeats 1 -GroupRepeats 1 -FreshProcesses 0 -FullProcesses 10

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-diagnostic-${{ matrix.label }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            build/diagnostics/**
            build/capture-selftest/**
            build/${{ matrix.config }}/*.pdb
            build/${{ matrix.config }}/*.exe
            build/${{ matrix.config }}/*.dll
            build/${{ matrix.config }}/D3D12/**
            build/CMakeCache.txt
